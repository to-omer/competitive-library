[package]
name = "verify_source"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "verify-source"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.104"
codesnip = "0.6.2"
codesnip_core = "0.6.2"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
rust_minify = "0.2.0"
serde_json = "1.0.154"
syn = { version = "3.0.9", features = ["full", "visit", "visit-mut"] }
tempfile = "3.27.0"
