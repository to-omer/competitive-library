[package]
name = "competitive"
version = "0.1.0"
authors = ["to-omer <toomerhs@gmail.com>"]
edition = "2024"
rust-version = "1.99"

[package.metadata.verus]
verify = true

[lib]
doc-scrape-examples = true

[features]
verify_doc = []

[dependencies]
codesnip = { version = "0.6.0", package = "codesnip_attr", features = [
    "check",
] }
vstd = { version = "0.0.0-2026-11-01-0251", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly)', 'cfg(kani)', 'cfg(verus_keep_ghost)'] }
