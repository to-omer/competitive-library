[config]
default_to_workspace = false

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[tasks.build]
command = "cargo"
args = ["build", "--workspace", "--all-targets"]

[tasks.test]
command = "cargo"
args = ["test", "--workspace", "--all-targets", "--no-fail-fast"]

[tasks.snippet]
command = "bash"
args = [".github/workflows/snippet.sh"]

[tasks.cov]
command = "cargo"
args = [
    "llvm-cov",
    "--workspace",
    "--all-targets",
    "--lcov",
    "--output-path",
    "./target/lcov.info",
]

[tasks.all]
dependencies = ["fmt", "clippy", "test", "snippet"]

[tasks.formal-verus]
install_crate = false
command = "cargo"
args = [
    "verus",
    "verify",
    "-p",
    "competitive",
    "--features",
    "vstd",
    "--fwd-verus-args-to",
    "roots",
    "--",
    "--no-cheating",
    "--triggers-mode",
    "silent",
    "--time-expanded",
    "@@split(CARGO_MAKE_TASK_ARGS,;,remove-empty)",
]

[tasks.formal-kani]
install_crate = false
command = "cargo"
args = [
    "kani",
    "-p",
    "competitive",
    "--output-format",
    "terse",
    "--jobs",
    "@@split(CARGO_MAKE_TASK_ARGS,;,remove-empty)",
]

[tasks.formal]
dependencies = ["formal-verus", "formal-kani"]
